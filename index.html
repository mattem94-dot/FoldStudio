<!DOCTYPE html>

</head>
<body class="h-screen flex flex-col overflow-hidden">

  <header class="bg-[#161b22] border-b border-[#30363d] px-4 py-3 flex flex-wrap items-center justify-between gap-3">
    <div class="flex items-center gap-2">
      <div class="w-3 h-3 rounded-full bg-[#1DB954] animate-pulse"></div>
      <h1 class="font-bold text-lg tracking-wide">FoldStudio <span class="text-xs bg-[#238636] text-white px-2 py-0.5 rounded-full ml-1">Z Fold Ready</span></h1>
    </div>

    <div class="flex items-center gap-2 flex-1 max-w-2xl justify-end">
      <input id="ghToken" type="password" placeholder="Incolla GitHub Token (ghp_...)" 
        class="bg-[#0d1117] border border-[#30363d] rounded px-3 py-1.5 text-sm w-48 focus:outline-none focus:border-[#1DB954]">
      <input id="repoName" type="text" value="SpotFree-Android" placeholder="Nome Progetto" 
        class="bg-[#0d1117] border border-[#30363d] rounded px-3 py-1.5 text-sm w-36 focus:outline-none focus:border-[#1DB954]">
      <button onclick="startCloudBuild()" id="buildBtn"
        class="bg-[#1DB954] hover:bg-[#1ed760] text-black font-bold px-4 py-1.5 rounded text-sm transition flex items-center gap-2 shadow-lg">
        <span>⚡ GENERA APK IN CLOUD</span>
      </button>
    </div>
  </header>

  <div class="flex-1 flex overflow-hidden">
    <aside class="w-1/3 max-w-xs bg-[#161b22] border-r border-[#30363d] flex flex-col justify-between">
      <div class="p-3 overflow-y-auto">
        <div class="flex justify-between items-center mb-2">
          <span class="text-xs font-semibold uppercase text-gray-400">File del Progetto (9)</span>
          <button onclick="addNewFile()" class="text-xs text-[#1DB954] hover:underline">+ Nuovo File</button>
        </div>
        <ul id="fileList" class="space-y-1 text-sm"></ul>
      </div>

      <div class="p-3 border-t border-[#30363d] bg-[#0d1117]">
        <div class="text-xs font-semibold uppercase text-gray-400 mb-2">Stato Compilatore Cloud</div>
        <div id="statusLog" class="text-xs text-gray-300 h-36 overflow-y-auto space-y-1 font-mono bg-[#161b22] p-2 rounded border border-[#30363d]">
          <div>Tutti i 9 file di SpotFree sono precaricati! Inserisci il Token in alto e premi Genera APK.</div>
        </div>
        <div id="downloadContainer" class="mt-2 hidden">
          <a id="downloadLink" href="#" target="_blank"
            class="block w-full text-center bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 rounded text-sm">
            📥 VAI ALLA PAGINA DI DOWNLOAD APK
          </a>
        </div>
      </div>
    </aside>

    <main class="flex-1 flex flex-col bg-[#0d1117]">
      <div class="bg-[#161b22] px-4 py-2 border-b border-[#30363d] flex justify-between items-center">
        <span id="currentFileName" class="text-sm font-mono text-[#1DB954]">Seleziona un file</span>
        <span class="text-xs text-gray-400">Pronto per la compilazione</span>
      </div>
      <textarea id="codeEditor" oninput="saveCurrentFile()"
        class="flex-1 w-full bg-[#0d1117] text-gray-200 p-4 text-sm focus:outline-none resize-none leading-relaxed"
        spellcheck="false"></textarea>
    </main>
  </div>

projectFiles["app/src/main/java/com/example/spotfree/AdFreeMusicEngine.kt"] = [
  "package com.example.spotfree",
  "import kotlinx.coroutines.Dispatchers",
  "import kotlinx.coroutines.withContext",
  "import okhttp3.OkHttpClient",
  "import okhttp3.Request",
  "import okhttp3.RequestBody.Companion.toRequestBody",
  "import org.json.JSONObject",
  "import org.schabi.newpipe.extractor.NewPipe",
  "import org.schabi.newpipe.extractor.ServiceList",
  "import org.schabi.newpipe.extractor.downloader.Downloader",
  "import org.schabi.newpipe.extractor.downloader.Response",
  "import org.schabi.newpipe.extractor.localization.Localization",
  "import org.schabi.newpipe.extractor.stream.StreamInfo",
  "import org.schabi.newpipe.extractor.stream.StreamInfoItem",
  "import java.net.URLEncoder",
  "import java.util.concurrent.TimeUnit",
  "",
  "data class MusicTrack(val id: String, val title: String, val artist: String, val album: String, val coverUrl: String, val durationMs: Long)",
  "",
  "object AdFreeMusicEngine {",
  "    private var isInitialized = false",
  "    val favoriteTracks = mutableListOf<MusicTrack>()",
  "    private val httpClient = OkHttpClient.Builder().connectTimeout(15, TimeUnit.SECONDS).readTimeout(15, TimeUnit.SECONDS).build()",
  "",
  "    fun init() {",
  "        if (isInitialized) return",
  "        NewPipe.init(object : Downloader() {",
  "            override fun execute(request: org.schabi.newpipe.extractor.downloader.Request): Response {",
  "                val builder = Request.Builder().url(request.url())",
  "                request.headers().forEach { (k, v) -> v.forEach { builder.addHeader(k, it) } }",
  "                builder.header(\"User-Agent\", \"Mozilla/5.0\")",
  "                val body = request.dataToSend()?.toRequestBody(null)",
  "                builder.method(request.httpMethod(), body)",
  "                val res = httpClient.newCall(builder.build()).execute()",
  "                return Response(res.code, res.message, res.headers.toMultimap(), res.body?.string() ?: \"\", res.request.url.toString())",
  "            }",
  "        }, Localization.DEFAULT)",
  "        isInitialized = true",
  "    }",
  "",
  "    suspend fun searchCatalog(query: String): List<MusicTrack> = withContext(Dispatchers.IO) {",
  "        init()",
  "        val tracks = mutableListOf<MusicTrack>()",
  "        try {",
  "            val encoded = URLEncoder.encode(query, \"UTF-8\")",
  "            val req = Request.Builder().url(\"https://itunes.apple.com/search?term=\" + encoded + \"&media=music&entity=song&limit=25\").build()",
  "            val res = httpClient.newCall(req).execute()",
  "            val results = JSONObject(res.body?.string() ?: \"\").optJSONArray(\"results\") ?: return@withContext emptyList()",
  "            for (i in 0 until results.length()) {",
  "                val item = results.getJSONObject(i)",
  "                val cover = item.optString(\"artworkUrl100\").replace(\"100x100bb\", \"600x600bb\")",
  "                tracks.add(MusicTrack(item.optString(\"trackId\"), item.optString(\"trackName\"), item.optString(\"artistName\"), item.optString(\"collectionName\"), cover, item.optLong(\"trackTimeMillis\", 180000L)))",
  "            }",
  "        } catch (e: Exception) { e.printStackTrace() }",
  "        tracks",
  "    }",
  "",
  "    suspend fun extractDirectAudioUrl(track: MusicTrack): String? = withContext(Dispatchers.IO) {",
  "        init()",
  "        try {",
  "            val yt = ServiceList.YouTube",
  "            val extractor = yt.getSearchExtractor(track.artist + \" - \" + track.title + \" Official Audio\")",
  "            extractor.fetchPage()",
  "            val first = extractor.initialPage.items.filterIsInstance<StreamInfoItem>().firstOrNull() ?: return@withContext null",
  "            StreamInfo.getInfo(yt, first.url).audioStreams.maxByOrNull { it.averageBitrate }?.content",
  "        } catch (e: Exception) { null }",
  "    }",
  "}"
].join("\n");

projectFiles["app/src/main/java/com/example/spotfree/PlaybackService.kt"] = [
  "package com.example.spotfree",
  "import android.content.Intent",
  "import android.net.Uri",
  "import androidx.media3.common.AudioAttributes",
  "import androidx.media3.common.C",
  "import androidx.media3.common.MediaItem",
  "import androidx.media3.common.MediaMetadata",
  "import androidx.media3.exoplayer.ExoPlayer",
  "import androidx.media3.session.LibraryResult",
  "import androidx.media3.session.MediaLibraryService",
  "import androidx.media3.session.MediaSession",
  "import com.google.common.collect.ImmutableList",
  "import com.google.common.util.concurrent.Futures",
  "import com.google.common.util.concurrent.ListenableFuture",
  "import kotlinx.coroutines.CoroutineScope",
  "import kotlinx.coroutines.Dispatchers",
  "import kotlinx.coroutines.SupervisorJob",
  "import kotlinx.coroutines.guava.future",
  "",
  "class PlaybackService : MediaLibraryService() {",
  "    private var session: MediaLibrarySession? = null",
  "    private val scope = CoroutineScope(SupervisorJob() + Dispatchers.Main)",
  "    private val cache = mutableMapOf<String, MusicTrack>()",
  "",
  "    override fun onCreate() {",
  "        super.onCreate()",
  "        val attr = AudioAttributes.Builder().setContentType(C.AUDIO_CONTENT_TYPE_MUSIC).setUsage(C.USAGE_MEDIA).build()",
  "        val player = ExoPlayer.Builder(this).setAudioAttributes(attr, true).setHandleAudioBecomingNoisy(true).build()",
  "        session = MediaLibrarySession.Builder(this, player, AutoCallback()).build()",
  "    }",
  "    override fun onGetSession(info: MediaSession.ControllerInfo) = session",
  "",
  "    private inner class AutoCallback : MediaLibrarySession.Callback {",
  "        override fun onGetLibraryRoot(s: MediaLibrarySession, b: MediaSession.ControllerInfo, p: LibraryParams?): ListenableFuture<LibraryResult<MediaItem>> {",
  "            val root = MediaItem.Builder().setMediaId(\"root\").setMediaMetadata(MediaMetadata.Builder().setIsBrowsable(true).setIsPlayable(false).setTitle(\"SpotFree\").build()).build()",
  "            return Futures.immediateFuture(LibraryResult.ofItem(root, p))",
  "        }",
  "        override fun onGetChildren(s: MediaLibrarySession, b: MediaSession.ControllerInfo, parentId: String, page: Int, size: Int, p: LibraryParams?): ListenableFuture<LibraryResult<ImmutableList<MediaItem>>> = scope.future(Dispatchers.IO) {",
  "            when (parentId) {",
  "                \"root\" -> LibraryResult.ofItemList(listOf(tab(\"hits\", \"Top Hits Italia\"), tab(\"fav\", \"La tua libreria\")), p)",
  "                \"hits\" -> {",
  "                    val list = AdFreeMusicEngine.searchCatalog(\"Top Hits Italia\")",
  "                    list.forEach { cache[it.id] = it }",
  "                    LibraryResult.ofItemList(list.map { it.toMedia() }, p)",
  "                }",
  "                \"fav\" -> LibraryResult.ofItemList(AdFreeMusicEngine.favoriteTracks.map { it.toMedia() }, p)",
  "                else -> LibraryResult.ofItemList(emptyList(), p)",
  "            }",
  "        }",
  "        override fun onAddMediaItems(s: MediaSession, c: MediaSession.ControllerInfo, items: MutableList<MediaItem>): ListenableFuture<List<MediaItem>> = scope.future(Dispatchers.IO) {",
  "            items.map {",
  "                if (it.localConfiguration?.uri != null) it else {",
  "                    val t = cache[it.mediaId] ?: MusicTrack(it.mediaId, it.mediaMetadata.title.toString(), it.mediaMetadata.artist.toString(), \"\", \"\", 180000L)",
  "                    val url = AdFreeMusicEngine.extractDirectAudioUrl(t) ?: \"\"",
  "                    it.buildUpon().setUri(url).build()",
  "                }",
  "            }",
  "        }",
  "    }",
  "    private fun tab(id: String, title: String) = MediaItem.Builder().setMediaId(id).setMediaMetadata(MediaMetadata.Builder().setTitle(title).setIsBrowsable(true).setIsPlayable(false).build()).build()",
  "    private fun MusicTrack.toMedia() = MediaItem.Builder().setMediaId(id).setMediaMetadata(MediaMetadata.Builder().setTitle(title).setArtist(artist).setArtworkUri(Uri.parse(coverUrl)).setIsBrowsable(false).setIsPlayable(true).build()).build()",
  "    override fun onDestroy() { session?.run { player.release(); release() }; super.onDestroy() }",
  "}"
].join("\n");

  "",
  "class MainActivity : ComponentActivity() {",

  "",
  "@Composable",
  "fun SpotFreeScreen() {",
  "    val context = LocalContext.current",
  "    val scope = rememberCoroutineScope()",
  "    var tab by remember { mutableIntStateOf(0) }",
  "    var controller by remember { mutableStateOf<MediaController?>(null) }",

  "    var loading by remember { mutableStateOf(false) }",

  "            controller = future.get()?.apply {",
  "                addListener(object : Player.Listener { override fun onIsPlayingChanged(p: Boolean) { playing = p } })",
  "            }",

  "",

  "                }",
  "            }",
  "        }",
  "    ) { pad ->",
  "        Column(Modifier.fillMaxSize().padding(pad).padding(horizontal = 16.dp)) {",
  "            Spacer(Modifier.height(16.dp))",
  "            if (tab == 1) {",
  "                OutlinedTextField(",
  "                    value = query,",
  "                    onValueChange = { q -> query = q; scope.launch { delay(400); if (q.length > 1) tracks = AdFreeMusicEngine.searchCatalog(q) } },",
  "                    placeholder = { Text(\"Cerca brani o artisti (Zero Pubblicità)...\") },",
  "                    modifier = Modifier.fillMaxWidth()",
  "                )",
  "                Spacer(Modifier.height(12.dp))",
  "            } else {",
  "                Text(if (tab == 0) \"Solo Musica (Zero Podcast)\" else \"I tuoi brani preferiti\", color = Color.White, fontSize = 22.sp, fontWeight = FontWeight.Bold)",
  "                Spacer(Modifier.height(12.dp))",
  "            }",
  "            val listToShow = if (tab == 2) liked else tracks",
  "            LazyColumn(Modifier.fillMaxSize()) {",
  "                items(listToShow) { t ->",
  "                    Row(Modifier.fillMaxWidth().clickable { play(t) }.padding(vertical = 8.dp), verticalAlignment = Alignment.CenterVertically) {",
  "                        AsyncImage(model = t.coverUrl, contentDescription = null, modifier = Modifier.size(50.dp).clip(RoundedCornerShape(4.dp)), contentScale = ContentScale.Crop)",
  "                        Column(Modifier.weight(1f).padding(horizontal = 12.dp)) {",
  "                            Text(t.title, color = if (current?.id == t.id) SpotifyGreen else Color.White, fontSize = 16.sp, fontWeight = FontWeight.Medium, maxLines = 1, overflow = TextOverflow.Ellipsis)",
  "                            Text(t.artist + \" • \" + t.album, color = Color.Gray, fontSize = 13.sp, maxLines = 1, overflow = TextOverflow.Ellipsis)",
  "                        }",
  "                    }",
  "                }",
  "            }",
  "        }",
  "    }",
  "}"
].join("\n");

let activeFile = "app/src/main/java/com/example/spotfree/MainActivity.kt";

function renderFileList() {
  const list = document.getElementById("fileList");
  list.innerHTML = "";
  Object.keys(projectFiles).forEach(function(path) {
    const li = document.createElement("li");
    li.className = "px-2 py-1.5 rounded cursor-pointer truncate " + 
      (path === activeFile ? "bg-[#238636] text-white font-semibold" : "text-gray-300 hover:bg-[#30363d]");
    li.textContent = path;
    li.onclick = function() { selectFile(path); };
    list.appendChild(li);
  });
}

function selectFile(path) {
  activeFile = path;
  document.getElementById("currentFileName").textContent = path;
  document.getElementById("codeEditor").value = projectFiles[path];
  renderFileList();
}

function saveCurrentFile() {
  projectFiles[activeFile] = document.getElementById("codeEditor").value;
}

function addNewFile() {
  const path = prompt("Inserisci il percorso del nuovo file:");
  if (path && !projectFiles[path]) {
    projectFiles[path] = "";
    selectFile(path);
  }
}

function logStatus(msg) {
  const box = document.getElementById("statusLog");
  const line = document.createElement("div");
  line.textContent = "> " + msg;
  box.appendChild(line);
  box.scrollTop = box.scrollHeight;
}

function toBase64(str) {
  return btoa(unescape(encodeURIComponent(str)));
}

async function ghApi(url, method, token, body) {
  const headers = {
    "Authorization": "Bearer " + token,
    "Accept": "application/vnd.github+json"
  };
  const opts = { method: method, headers: headers };
  if (body) opts.body = JSON.stringify(body);
  return fetch("https://api.github.com" + url, opts);
}

async function startCloudBuild() {
  const token = document.getElementById("ghToken").value.trim();
  const repo = document.getElementById("repoName").value.trim();
  if (!token) return alert("Inserisci il tuo GitHub Token (ghp_...) nella casella in alto!");

  localStorage.setItem("foldstudio_token", token);
  const btn = document.getElementById("buildBtn");
  btn.disabled = true;
  btn.classList.add("opacity-50");
  document.getElementById("downloadContainer").classList.add("hidden");

  try {
    logStatus("Connessione a GitHub...");
    const userRes = await ghApi("/user", "GET", token);
    if (!userRes.ok) throw new Error("Token non valido! Controlla di aver copiato tutto il codice ghp_...");
    const user = await userRes.json();
    const owner = user.login;
    logStatus("Connesso come: " + owner);

    logStatus("Creazione/Verifica progetto " + repo + "...");
    await ghApi("/user/repos", "POST", token, { name: repo, private: true, auto_init: true });
    await new Promise(function(r) { setTimeout(r, 2000); });

    const entries = Object.entries(projectFiles);
    for (let i = 0; i < entries.length; i++) {
      const path = entries[i][0];
      const content = entries[i][1];
      logStatus("Caricamento (" + (i + 1) + "/" + entries.length + "): " + path);
      const apiUrl = "/repos/" + owner + "/" + repo + "/contents/" + path;
      let sha = null;
      const existing = await ghApi(apiUrl, "GET", token);
      if (existing.ok) {
        const data = await existing.json();
        sha = data.sha;
      }
      const payload = { message: "Update " + path, content: toBase64(content) };
      if (sha) payload.sha = sha;
      const putRes = await ghApi(apiUrl, "PUT", token, payload);
      if (!putRes.ok) throw new Error("Errore su " + path + " (Assicurati che il Token abbia i permessi repo e workflow)");
    }

    logStatus("Avvio server di compilazione Android...");
    await ghApi("/repos/" + owner + "/" + repo + "/actions/workflows/build.yml/dispatches", "POST", token, { ref: "main" });

    logStatus("Compilazione APK in corso (~90 secondi)...");
    let completed = false;
    while (!completed) {
      await new Promise(function(r) { setTimeout(r, 7000); });
      const runsRes = await ghApi("/repos/" + owner + "/" + repo + "/actions/runs?per_page=1", "GET", token);
      const runsData = await runsRes.json();
      const latestRun = runsData.workflow_runs && runsData.workflow_runs[0];

      if (latestRun) {
        logStatus("Stato server: " + latestRun.status + "...");
        if (latestRun.status === "completed") {
          completed = true;
          if (latestRun.conclusion === "success") {
            logStatus("✅ APK GENERATO CON SUCCESSO!");
            const dlLink = document.getElementById("downloadLink");
            dlLink.href = latestRun.html_url;
            document.getElementById("downloadContainer").classList.remove("hidden");
          } else {
            logStatus("❌ Errore compilazione. Dettagli: " + latestRun.html_url);
          }
        }
      }
    }
  } catch (err) {
    logStatus("ERRORE: " + err.message);
  } finally {
    btn.disabled = false;
    btn.classList.remove("opacity-50");
  }
}

window.onload = function() {
  const saved = localStorage.getItem("foldstudio_token");
  if (saved) document.getElementById("ghToken").value = saved;
  selectFile(activeFile);
};
</script>
